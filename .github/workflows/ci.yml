name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ruff + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,server,mcp]"

      - name: Lint
        run: ruff check .

      # The TypeScript SDK (sdk-ts/) is type-checked and unit-tested here, and
      # tests/integration/test_typescript_sdk.py plays it against the server,
      # running its sources with Node's type stripping.
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sdk-ts/package-lock.json

      - name: TypeScript SDK (typecheck, unit tests)
        working-directory: sdk-ts
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Test
        run: pytest -q
