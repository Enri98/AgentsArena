name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ruff + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,server,mcp]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      # The TypeScript SDK (sdk-ts/) is type-checked and unit-tested here, and
      # tests/integration/test_typescript_sdk.py plays it against the server,
      # running its sources with Node's type stripping.
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sdk-ts/package-lock.json

      - name: TypeScript SDK (typecheck, unit tests)
        working-directory: sdk-ts
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Test
        run: pytest -q

  package:
    name: build + install the distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # What a user gets from PyPI: the sdist and wheel build, their metadata
      # renders, and the wheel installs and runs outside the source tree
      # (templates and py.typed included).
      - name: Build and check
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*

      # Each extra on its own, as a user installs it: every command either works
      # or names the extra it needs.
      - name: Install the wheel and smoke-test it
        run: |
          wheel="$(ls dist/*.whl)"
          cd /tmp

          python -m venv base && base/bin/pip install -q "$wheel"
          base/bin/python -c "import arena; from arena.games import build_default_registry; print(arena.__version__, [d.game_id for d in build_default_registry().list()])"
          base/bin/python -c "import importlib.resources as r; assert (r.files('arena.games.scaffold') / 'templates' / 'hidden' / 'rules.py.tmpl').is_file(); assert (r.files('arena') / 'py.typed').is_file()"
          base/bin/arena-play --help > /dev/null
          base/bin/arena-replay --help > /dev/null
          base/bin/arena-scaffold --help > /dev/null
          for cmd in arena-server arena-mcp; do
            if base/bin/$cmd --help 2> err.txt; then echo "$cmd ran without its extra"; exit 1; fi
            grep -q "pip install 'agents-arena\[" err.txt || { cat err.txt; exit 1; }
          done

          python -m venv client && client/bin/pip install -q "${wheel}[client]"
          client/bin/python -c "import arena.sdk"

          python -m venv server && server/bin/pip install -q "${wheel}[server]"
          server/bin/python -c "import arena.server.app"
          server/bin/arena-server --help > /dev/null

          python -m venv mcpenv && mcpenv/bin/pip install -q "${wheel}[mcp]"
          mcpenv/bin/arena-mcp --help > /dev/null
