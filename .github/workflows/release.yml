name: Release

# Push a tag vX.Y.Z on main (CONTRIBUTING.md, "Releasing"). This builds and
# checks both packages and attaches them to a GitHub release. Publishing to
# PyPI and npm is opt-in: set the repository variable PUBLISH_PACKAGES to
# "true" once trusted publishing (PyPI) and an NPM_TOKEN secret are configured.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the main-branch check below needs the history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: The tag is on main and matches every version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main || {
            echo "Tag ${GITHUB_REF_NAME} is not on main"; exit 1; }
          tag="${GITHUB_REF_NAME#v}"
          py=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          ts=$(python -c "import json; print(json.load(open('sdk-ts/package.json'))['version'])")
          client=$(grep -oP 'CLIENT_VERSION = "\K[^"]+' sdk-ts/src/protocol.ts)
          for v in "$py" "$ts" "$client"; do
            test "$v" = "$tag" || {
              echo "Tag ${GITHUB_REF_NAME}: pyproject ${py}, package.json ${ts}, CLIENT_VERSION ${client}"; exit 1; }
          done

      - name: Build the Python distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*

      - name: The wheel installs and imports
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install dist/*.whl
          /tmp/wheel-check/bin/python -c "import arena, arena.games; print(arena.__version__)"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sdk-ts/package-lock.json

      - name: Build and pack the TypeScript SDK
        working-directory: sdk-ts
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          npm pack --pack-destination ../dist

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  github-release:
    name: GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the release with the built packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --notes "See CHANGELOG.md."

  publish-pypi:
    name: Publish to PyPI
    needs: [build, github-release]
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_PACKAGES == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing: no token stored in the repository
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Keep only the Python distributions
        run: rm -f dist/*.tgz
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-npm:
    name: Publish to npm
    needs: [build, github-release]
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_PACKAGES == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Publish, unless this version is already on npm
        run: |
          version="${GITHUB_REF_NAME#v}"
          if npm view "@agents-arena/sdk@${version}" version > /dev/null 2>&1; then
            echo "@agents-arena/sdk@${version} is already published; skipping."
          else
            npm publish dist/*.tgz --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
