[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agents-arena"
version = "0.1.0"
description = "Pure simulation package for deterministic turn-based games."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "websockets>=13",
    "structlog>=24",
]
mcp = [
    "mcp>=1.0",
]
dev = [
    "pytest>=8",
    "pytest-timeout>=2.3",
    "ruff>=0.11",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "websockets>=12",
    "structlog>=24",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A hung WebSocket test must fail, not block CI forever. thread method because the
# hangs live in TestClient portal threads, and signal-based timeouts are not
# available on Windows.
addopts = "-ra --timeout=120 --timeout-method=thread"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
